<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        ASPRI : Aplikasi Analisis Prestasi Siswa
        {% endblock %}
    </title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <div class="app-wrapper">


        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->

        <aside class="sidebar">

            <div class="sidebar-brand">

                <div class="brand-icon">
                    <i class="bi bi-bar-chart-line"></i>
                </div>

                <div>
                    <div class="brand-title">
                        ASPRI
                    </div>

                    <small>
                        Analisis Prestasi Siswa
                    </small>
                </div>

            </div>


            <hr>


            <!-- MENU -->

            <nav class="sidebar-menu">

                <a href="{{ url_for('home') }}" class="sidebar-link
                {% if request.endpoint == 'home' %}active{% endif %}">
                    <i class="bi bi-house"></i>
                    <span>Home</span>
                </a>


                <a href="{{ url_for('upload_data') }}" class="sidebar-link
                {% if request.endpoint == 'upload_data' %}active{% endif %}">
                    <i class="bi bi-upload"></i>
                    <span>Upload Data</span>
                </a>


                <a href="{{ url_for('process_analysis') }}" class="sidebar-link
                {% if request.endpoint == 'process_analysis' %}active{% endif %}">
                    <i class="bi bi-gear"></i>
                    <span>Proses & Analisis</span>
                </a>


                <a href="{{ url_for('prediction') }}" class="sidebar-link
                {% if request.endpoint == 'prediction' %}active{% endif %}">
                    <i class="bi bi-bar-chart"></i>
                    <span>Hasil Prediksi</span>
                </a>

            </nav>


        </aside>



        <!-- ========================= -->
        <!-- MAIN AREA -->
        <!-- ========================= -->

        <div class="main-wrapper">


            <!-- TOPBAR -->





            <!-- CONTENT -->

            <main class="content">

                {% block content %}
                {% endblock %}

            </main>


        </div>


    </div>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JS -->

    <script src="{{ url_for('static', filename='js/app.js') }}">
    </script>


</body>

</html>
